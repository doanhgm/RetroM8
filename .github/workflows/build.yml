name: Build RetroM8 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Download Libretro Cores (armeabi-v7a)
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cd app/src/main/jniLibs/armeabi-v7a

          curl -fSL "https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/fceumm_libretro_android.so.zip" -o fceumm.zip
          unzip -o fceumm.zip
          mv fceumm_libretro_android.so libfceumm.so
          rm fceumm.zip

          curl -fSL "https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/pcsx_rearmed_libretro_android.so.zip" -o pcsx.zip
          unzip -o pcsx.zip
          mv pcsx_rearmed_libretro_android.so libpcsx_rearmed.so
          rm pcsx.zip

          ls -lh

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroM8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
