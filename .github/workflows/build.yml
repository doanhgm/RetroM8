name: Build RetroM8 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Download Libretro Cores (armeabi-v7a)
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cd app/src/main/jniLibs/armeabi-v7a

          for core in fceumm snes9x mgba pcsx_rearmed; do
            curl -fSL "https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/${core}_libretro_android.so.zip" -o "${core}.zip"
            unzip -o "${core}.zip"
            mv "${core}_libretro_android.so" "lib${core}.so"
            rm "${core}.zip"
          done

          ls -lh

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroM8-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
